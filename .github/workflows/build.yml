name: Build
on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  ZIP_NAME: sigma
  MARKETPLACE_ITEM_ID: 721

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Create dist archive
        run: zip -r ${{ env.ZIP_NAME }}.zip dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}.zip

      - name: Generate version tag
        id: version_tag
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          TAG="build-$COMMIT_HASH-$(date +'%Y%m%d%H%M%S')"
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Create and push Git tag
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git tag ${{ steps.version_tag.outputs.version }}
          git push origin ${{ steps.version_tag.outputs.version }}
      
      - name: Upload to GitHub Release
        id: release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ env.ZIP_NAME }}.zip
          tag_name: ${{ steps.version_tag.outputs.version }}
          prerelease: true
          name: "Build Release ${{ steps.version_tag.outputs.version }}"
      
      - name: Upload to LiquidBounce Marketplace
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
          VERSION: ${{ steps.version_tag.outputs.version }}
          SOURCE_RELEASE_URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          SOURCE_COMMIT=$(git rev-parse HEAD)
          curl -X POST \
            "https://api.liquidbounce.net/api/v3/marketplace/${MARKETPLACE_ITEM_ID}/revisions" \
            -H "Authorization: Bearer ${API_TOKEN}" \
            -F "file=@${ZIP_NAME}.zip" \
            --form-string "version=${VERSION}" \
            --form-string "changelog=Automated build from commit ${GITHUB_SHA}" \
            --form-string "channel=alpha" \
            --form-string "source_repository=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --form-string "source_ref=${GITHUB_REF}" \
            --form-string "source_commit=${SOURCE_COMMIT}" \
            --form-string "source_release_tag=${VERSION}" \
            --form-string "source_release_url=${SOURCE_RELEASE_URL}" \
            --form-string "source_build_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --fail-with-body